<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-label="Anonymised sagittal knee MRI placeholder">
	<defs>
		<radialGradient id="bg" cx="50%" cy="40%" r="75%">
			<stop offset="0" stop-color="#15223c" />
			<stop offset="1" stop-color="#0b1020" />
		</radialGradient>
		<linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#4a678f" />
			<stop offset="1" stop-color="#2b3f63" />
		</linearGradient>
		<pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
			<path d="M50 0H0V50" fill="none" stroke="#23345a" stroke-width="1" opacity=".5" />
		</pattern>
	</defs>
	<rect width="1500" height="900" fill="url(#bg)" />
	<rect width="1500" height="900" fill="url(#grid)" />
	<!-- femur -->
	<path d="M560 240c-20-70 40-150 150-160l420-40c90-10 140 60 118 130-8 26-30 40-58 40l-520 30 30 40Z" fill="url(#bone)" opacity=".9" />
	<!-- femur cortex highlight -->
	<path d="M980 60l360-36c84-8 128 52 108 116" fill="none" stroke="#dce9f7" stroke-width="3" opacity=".5" />
	<!-- patella -->
	<path d="M600 300c-70-16-96 44-44 96 26 26 74 18 96-18 8-12 4-68-52-78Z" fill="url(#bone)" opacity=".95" />
	<!-- tibia -->
	<path d="M560 470c-10 30 6 70 22 90l120 170c14 20 60 34 92 30 60-8 96-52 92-114l-30-250-24 4c-60 8-260-4-272 70Z" fill="url(#bone)" opacity=".92" />
	<!-- menisci -->
	<path d="M560 442c40-22 120-24 200-6" fill="none" stroke="#7fa8d9" stroke-width="12" stroke-linecap="round" opacity=".7" />
	<path d="M560 470c60-14 140-18 210-6" fill="none" stroke="#8fb6e4" stroke-width="10" stroke-linecap="round" opacity=".65" />
	<!-- ACL -->
	<path d="M620 428c60-6 120 10 160 56" fill="none" stroke="#9fc4ef" stroke-width="7" stroke-dasharray="10 8" opacity=".8" />
	<!-- joint effusion highlight -->
	<ellipse cx="640" cy="452" rx="30" ry="14" fill="#bcd8f0" opacity="0" />
	<ellipse cx="640" cy="452" rx="30" ry="14" fill="#bcd8f0" opacity=".5" />
	<text x="96" y="84" fill="#93aacf" font-family="ui-monospace, monospace" font-size="34" opacity=".9">SERIES 2 · SAG PD FS</text>
	<text x="96" y="846" fill="#93aacf" font-family="ui-monospace, monospace" font-size="34" opacity=".9">SLICE 14/22 · 3mm</text>
	<text x="1210" y="846" fill="#93aacf" font-family="ui-monospace, monospace" font-size="34" opacity=".9">W:520 L:220</text>
	<text x="560" y="790" fill="#e2e9f5" font-family="ui-sans-serif, sans-serif" font-size="30" font-weight="600" letter-spacing="4" opacity=".35">ANONYMISED — NOT FOR DIAGNOSIS</text>
</svg>